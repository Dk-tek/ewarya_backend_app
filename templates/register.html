{% load static %}
<!DOCTYPE html>
<html lang="en" data-page="register">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Register - Evarya Health Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/shared.css' %}">
<style>
  body { min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(135deg,#eef8f5,#f8fafc); }
  .auth-shell { width:100%; max-width:520px; background:#fff; border:1px solid var(--border); border-radius:18px; padding:30px; box-shadow:0 18px 50px rgba(15,23,42,.12); }
  .auth-title { font-family:'DM Serif Display',serif; font-size:1.7rem; color:var(--navy); margin-bottom:6px; }
  .auth-sub { color:var(--muted); font-size:.86rem; margin-bottom:20px; }
  .auth-actions { display:flex; gap:10px; align-items:center; margin-top:16px; }
  .auth-actions .btn-hc { flex:1; }
  .auth-link { display:block; margin-top:18px; font-size:.82rem; color:var(--teal-dark); text-align:center; font-weight:700; }
  @media(max-width:640px){ .auth-actions { flex-direction:column; } .auth-actions .btn-hc { width:100%; } }
</style>
</head>
<body>
  <form class="auth-shell" id="registerForm">
    <div class="auth-title">Create Admin Account</div>
    <div class="auth-sub">Create a staff console account for dashboard, family data, and triage management.</div>
    <div id="status" class="hc-status" style="margin-bottom:16px;">Ready.</div>
    <div class="hc-form-grid">
      <label class="hc-label">Username<input name="username" required autocomplete="username" placeholder="demo_user"></label>
      <label class="hc-label">Password<input name="password" type="password" required autocomplete="new-password" placeholder="secret123"></label>
      <label class="hc-label">Phone Number<input name="phone_number" required placeholder="+91XXXXXXXXXX"></label>
      <label class="hc-label">Email<input name="email" type="email" placeholder="user@email.com"></label>
    </div>
    <div class="auth-actions">
      <button class="btn-hc">Register</button>
      <a class="btn-hc secondary" href="/login/">Login</a>
    </div>
    <a class="auth-link" href="/hc-auth/">Open full auth console</a>
  </form>

<script src="{% static 'js/hc-core.js' %}"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', async event => {
    event.preventDefault();
    try {
      const data = await request('/api/auth/register/', {
        method: 'POST',
        body: JSON.stringify(compactPayload(formData(event.target)))
      });
      state.user = data.user;
      setTokens(data.tokens);
      setStatus('Admin account created. Opening triage builder...');
      window.location.href = '/hc-builder/';
    } catch (error) {
      setStatus(error.message, true);
    }
  });
</script>
</body>
</html>
