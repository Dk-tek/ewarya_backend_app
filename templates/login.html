{% load static %}
<!DOCTYPE html>
<html lang="en" data-page="login">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Evarya Health Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/shared.css' %}">
<style>
  body { min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(135deg,#eef8f5,#f8fafc); }
  .auth-shell { width:100%; max-width:440px; background:#fff; border:1px solid var(--border); border-radius:18px; padding:30px; box-shadow:0 18px 50px rgba(15,23,42,.12); }
  .auth-title { font-family:'DM Serif Display',serif; font-size:1.7rem; color:var(--navy); margin-bottom:6px; }
  .auth-sub { color:var(--muted); font-size:.86rem; margin-bottom:20px; }
  .auth-actions { display:flex; gap:10px; align-items:center; margin-top:16px; }
  .auth-actions .btn-hc { flex:1; }
  .auth-link { display:block; margin-top:18px; font-size:.82rem; color:var(--teal-dark); text-align:center; font-weight:700; }
</style>
</head>
<body>
  <form class="auth-shell" id="loginForm">
    <div class="auth-title">Admin Login</div>
    <div class="auth-sub">Sign in to access the Health Console, triage builder, and API tools.</div>
    <div id="status" class="hc-status" style="margin-bottom:16px;">Ready.</div>
    <div class="hc-form-grid">
      <label class="hc-label full">Username<input name="username" required autocomplete="username" placeholder="Enter username"></label>
      <label class="hc-label full">Password<input name="password" type="password" required autocomplete="current-password" placeholder="Enter password"></label>
    </div>
    <div class="auth-actions">
      <button class="btn-hc">Login</button>
      <a class="btn-hc secondary" href="/register/">Create Admin</a>
    </div>
    <a class="auth-link" href="/hc-auth/">Open full auth console</a>
  </form>

<script src="{% static 'js/hc-core.js' %}"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async event => {
    event.preventDefault();
    try {
      const data = await request('/api/auth/login/password/', {
        method: 'POST',
        body: JSON.stringify(compactPayload(formData(event.target)))
      });
      state.user = data.user;
      setTokens(data.tokens);
      setStatus('Logged in. Opening triage builder...');
      window.location.href = '/hc-builder/';
    } catch (error) {
      setStatus(error.message, true);
    }
  });
</script>
</body>
</html>
